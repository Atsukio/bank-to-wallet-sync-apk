# Unit tests, lint and a debug build on every push and pull request. No secrets: without
# keystore.properties the build signs with the debug key, and nothing talks to Wallet.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Starts Gradle; the daemon then fetches its own Java 21 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
